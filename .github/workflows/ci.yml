name: CI Pipeline

on:
  push:
    branches: [ main, develop, "feature/**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmupdf-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest pytest-asyncio pytest-cov ruff mypy email-validator openai argon2-cffi

      - name: Run Ruff Lint Check
        run: |
          python -m ruff check src tests scripts benchmarks

      - name: Run Ruff Format Check
        run: |
          python -m ruff format --check src tests scripts benchmarks

      - name: Run Pytest Test Suite
        env:
          JWT_SECRET: "ci-jwt-secret-very-secure-key-32-chars-long"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: |
          python -m pytest --cov=invoiceflow --cov-report=term-missing

      - name: Run Application QA Verification
        env:
          JWT_SECRET: "ci-jwt-secret-very-secure-key-32-chars-long"
          OPENAI_API_KEY: "${{ secrets.OPENAI_API_KEY }}"
          OPENAI_BASE_URL: "https://api.modelapi.vn/v1"
          OPENAI_MODEL_ID: "gpt-6.1-sol"
        run: |
          python scripts/run_application_qa.py

  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: |
          pnpm approve-builds esbuild || true
          pnpm install

      - name: Run TypeScript Typecheck & Build
        working-directory: apps/web
        run: |
          pnpm build

      - name: Upload Frontend Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/web/dist

  e2e-playwright:
    name: E2E Playwright Browser Tests
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest pytest-asyncio email-validator argon2-cffi playwright
          playwright install --with-deps chromium

      - name: Download Frontend Dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: apps/web/dist

      - name: Run Playwright E2E Suite
        env:
          JWT_SECRET: "ci-jwt-secret-very-secure-key-32-chars-long"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: |
          python -m pytest tests/e2e/test_playwright_e2e.py -v

  docling-pipeline:
    name: Real Docling OCR Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmupdf-dev tesseract-ocr

      - name: Install Docling Package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,documents]" pytest pytest-asyncio

      - name: Run Docling Pipeline Tests
        run: |
          python -m pytest tests/unit/document/test_docling_adapter.py -v
