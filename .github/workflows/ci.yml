name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmupdf-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest Test Suite
        run: |
          python -m pytest --cov=invoiceflow --cov-report=term-missing

      - name: Run Frozen Benchmark Verification
        run: |
          python benchmarks/scripts/run_benchmark.py

  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: |
          pnpm approve-builds esbuild || true
          pnpm install

      - name: Run TypeScript Typecheck & Build
        working-directory: apps/web
        run: |
          pnpm build
