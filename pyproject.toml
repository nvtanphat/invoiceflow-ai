[project]
name = "invoiceflow"
version = "0.1.0"
description = "InvoiceFlow AI — Accounts Payable Document Processing & 3-Way Reconciliation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.10.0",
    "email-validator>=2.2.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "dramatiq[redis]>=1.17.0",
    "defusedxml>=0.7.1",
    "lxml>=5.3.0",
    "pymupdf>=1.25.0",
    "google-genai>=0.1.1",
    "openai>=1.50.0",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.19",
    "pyjwt>=2.10.0",
    "argon2-cffi>=23.1.0",
    "pwdlib[argon2]>=0.2.0",
    "cryptography>=44.0.0",
    "httpx>=0.28.0",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
documents = [
    "docling>=2.87.0",
    "easyocr>=1.7.2",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoiceflow"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "."]
testpaths = ["tests/unit", "tests/integration", "tests/contracts", "tests/security"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
